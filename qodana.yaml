version: "1.0"
exclude:
  - name: All
    paths:
      - build/          # Папка с результатами сборки Gradle
      - .gradle/        # Кэш Gradle
      - gradlew         # Скрипт обертки
      - gradlew.bat     # Скрипт обертки (Windows)
      - .idea/          # Настройки IDE
      - allure-results/ # Результаты тестов (Qodana не должен анализировать JSON отчеты)
      - .git/
projectJDK: "17"
linter: jetbrains/qodana-jvm-community:2025.3

