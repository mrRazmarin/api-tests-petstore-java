name: Run API Tests

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-api:
    name: Run Java Tests
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Клонирование кода
      - name: Checkout code
        uses: actions/checkout@v4

      # Шаг 2: Установка Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin' # Рекомендуемый дистрибутив OpenJDK

      # Шаг 3: Настройка Gradle (кеширование зависимостей, запуск wrapper)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Шаг 4: Установка зависимостей (опционально, так как gradle test сделает это сам, но полезно для проверки)
      - name: Build project
        run: ./gradlew build -x test

      # Шаг 5: Запуск Petstore API (Docker)
      - name: Start Petstore API
        run: docker compose up -d

      # Шаг 6: Ожидание старта
      - name: Wait for API
        run: sleep 15

      # Шаг 7: Запуск тестов
      - name: Run Tests
        env:
          PETSTORE_URL: http://localhost:8080/v2
        run: ./gradlew clean test

      # Шаг 8: Загрузка артефакта (Allure Results)
      - name: Upload Allure Results
        if: always() # Выполнять даже если тесты упали
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: build/allure-results
          retention-days: 30

      # Шаг 9: Остановка контейнера
      - name: Stop Petstore
        if: always()
        run: docker compose down